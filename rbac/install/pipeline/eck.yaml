---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:eck
  namespace: eck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:install-pipeline:eck
subjects:
  - kind: ServiceAccount
    name: mas-{{ mas_instance_id }}-install-pipeline
    namespace: mas-{{ mas_instance_id }}-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:eck
  namespace: eck
rules:
  # Work with ECK namespace resources
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - create
      - patch
  # Work with ECK custom resources
  - apiGroups:
      - elasticsearch.k8s.elastic.co
    resources:
      - elasticsearches
    verbs:
      - get
      - list
      - patch
      - create
      - watch
  - apiGroups:
      - kibana.k8s.elastic.co
    resources:
      - kibanas
    verbs:
      - get
      - list
      - patch
      - create
      - watch
  - apiGroups:
      - logstash.k8s.elastic.co
    resources:
      - logstashes
    verbs:
      - get
      - list
      - patch
      - create
      - watch
  # DaemonSets for Filebeat
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - get
      - list
      - patch
      - create
  # Cert-manager resources for ECK TLS
  - apiGroups:
      - cert-manager.io
    resources:
      - issuers
      - certificates
    verbs:
      - get
      - list
      - patch
      - create
      - watch
  # Routes for Elasticsearch and Kibana
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - patch
      - create
