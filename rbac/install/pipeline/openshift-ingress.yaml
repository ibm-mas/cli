---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:openshift-ingress
  namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:install-pipeline:openshift-ingress
subjects:
  - kind: ServiceAccount
    name: mas-{{ mas_instance_id }}-install-pipeline
    namespace: mas-{{ mas_instance_id }}-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:openshift-ingress
  namespace: openshift-ingress
rules:
  # Required to lookup the default ingress TLS certificate
  # get: lookup of a named secret (router-certs-default, cluster domain secret, IngressController defaultCertificate)
  # list: last-resort fallback that lists all secrets in the namespace (ROSA, TechZone, and some IPI installs)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
