---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:update-user:openshift-operators
  namespace: openshift-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:update-user:openshift-operators
subjects:
  - kind: ServiceAccount
    name: mas-update-user
    namespace: mas-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:update-user:openshift-operators
  namespace: openshift-operators
rules:
  # MAS update lists the subscriptions to detect whether the Open Data Hub operator is installed (needs migrating to RHOAI)
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - list
