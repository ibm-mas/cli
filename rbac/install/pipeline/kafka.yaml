  name: mas:{{ mas_instance_id }}:install-pipeline:kafka-amq-streams
subjects:
  - kind: ServiceAccount
    name: mas-{{ mas_instance_id }}-install-pipeline
    namespace: mas-{{ mas_instance_id }}-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:kafka-amq-streams
  namespace: amq-streams
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
      - operatorgroups
      - subscriptions
    verbs:
      - get
      - list
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - create
      - patch

  - apiGroups:
      - kafka.strimzi.io
    resources:
      - kafkas
      - kafkausers
    verbs:
      - get
      - list
      - create
      - patch
      - watch
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - podmonitors
    verbs:
      - get
      - list
      - create
      - patch
  - apiGroups:
      - integreatly.org
      - grafana.integreatly.org
    resources:
      - grafanadashboards
    verbs:
      - get
      - list
      - create
      - patch
