---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mas:{{ mas_instance_id }}:install-pipeline
subjects:
  - kind: ServiceAccount
    name: mas-{{ mas_instance_id }}-install-pipeline
    namespace: mas-{{ mas_instance_id }}-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline
rules:
  # ocp_verify will lookup the clusterversion to determine health of the cluster, and obtain the cluster ingres cert from the proxy/ingress
  - apiGroups:
      - config.openshift.io
    resources:
      - clusterversions
      - proxies
      - ingresses
    verbs:
      - get

  # ibm_catalogs will lookup available imagedigestmirrorsets to determine whether we are using a mirror
  - apiGroups:
      - config.openshift.io
    resources:
      - imagedigestmirrorsets
    verbs:
      - list

  # ocp_verify will query all installed catalogsources, and subscriptions
  - apiGroups:
      - operators.coreos.com
    resources:
      - catalogsources
      - subscriptions
    verbs:
      - get
      - list

  # kafka role lists OperatorConditions cluster-wide to detect a conflicting Strimzi / AMQ Streams install
  - apiGroups:
      - operators.coreos.com
    resources:
      - operatorconditions
    verbs:
      - list

  # ocp_verify will query all deployments and statefulsets to check health of the cluster
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list

  # Used to detect whether the install is a disconnected install in various places
  - apiGroups:
      - operator.openshift.io
    resources:
      - imagecontentsourcepolicies
    verbs:
      - get

  # Monitor the progress of operator installations
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get

  # DRO install will search all namespaces for a BASCfg
  - apiGroups:
      - config.mas.ibm.com
    resources:
      - bascfgs
    verbs:
      - list

  # DRO install will attempt to get the IBM entitlement key from any namespace where it finds a BASCfg
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get

  # The CertManager install is cluster scoped
  - apiGroups:
      - operator.openshift.io
    resources:
      - certmanagers
    verbs:
      - get
      - patch

  # Pipeline needs to create namespaces for dependencies (db2, mongoce, etc.)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - create
      - patch
      - list

  # Used by any role that includes common_tasks/default_storage_classes.yml, e.g. grafana, mongodb, kafka, minio)
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list

  # Creating routes with custom hostnames requires cluster-wide permission
  - apiGroups:
      - route.openshift.io
    resources:
      - routes/custom-host
    verbs:
      - create
      - update

  # Nvidia GPU operator ClusterPolicy is cluster-scoped
  - apiGroups:
      - nvidia.com
    resources:
      - clusterpolicies
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - watch

  # Allow binding and escalating ClusterRoles (including admin) without having all their permissions
  # This is required for CPD to assign the admin role to service accounts
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
      - escalate
    resourceNames:
      - admin
      - edit
      - view

  # Cert-manager ClusterIssuer for cluster-wide TLS (MAS 9.2+)
  - apiGroups:
      - cert-manager.io
    resources:
      - clusterissuers
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - watch

  # ConsoleLink creation for MAS Admin Dashboard in OpenShift Console
  - apiGroups:
      - console.openshift.io
    resources:
      - consolelinks
    verbs:
      - get
      - create
      - patch
