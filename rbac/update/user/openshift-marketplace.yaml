---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:update-user:openshift-marketplace
  namespace: openshift-marketplace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:update-user:openshift-marketplace
subjects:
  - kind: ServiceAccount
    name: mas-update-user
    namespace: mas-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:update-user:openshift-marketplace
  namespace: openshift-marketplace
rules:
  # MAS update reads the ibm-operator-catalog catalog source to determine the currently installed catalog version
  - apiGroups:
      - operators.coreos.com
    resources:
      - catalogsources
    verbs:
      - get
    resourceNames:
      - ibm-operator-catalog
