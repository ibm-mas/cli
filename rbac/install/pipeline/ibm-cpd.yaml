---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:ibm-cpd-operators
  namespace: ibm-cpd-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:install-pipeline:ibm-cpd-operators
subjects:
  - kind: ServiceAccount
    name: mas-{{ mas_instance_id }}-install-pipeline
    namespace: mas-{{ mas_instance_id }}-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:ibm-cpd-operators
  namespace: ibm-cpd-operators
rules:
  # Cloud Pak for Data operator installation
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
      - operatorgroups
      - subscriptions
    verbs:
      - get
      - list
      - create
      - patch
  # IBM entitlement key secret and service accounts
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - create
      - patch
      - update
  # CPD operators need to create RBAC resources
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - delete
  # Grant wildcard permissions that CPD operators need to delegate
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
      - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:ibm-cpd
  namespace: ibm-cpd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:install-pipeline:ibm-cpd
subjects:
  - kind: ServiceAccount
    name: mas-{{ mas_instance_id }}-install-pipeline
    namespace: mas-{{ mas_instance_id }}-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:install-pipeline:ibm-cpd
  namespace: ibm-cpd
rules:
  # Cloud Pak for Data instance management
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - serviceaccounts
    verbs:
      - get
      - list
      - create
      - patch
      - update
  # CPD services and deployments
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - create
      - patch
      - update
  # CPD routes
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - create
      - patch
      - update
  # Ibmcpd CR (OLM install path, CP4D < 5.4.0)
  - apiGroups:
      - cpd.ibm.com
    resources:
      - ibmcpds
    verbs:
      - get
      - list
      - create
      - patch
  # authorize-user-cpd-admin.yml applies cp4d cpd_platform/rbac.yml.j2 into this namespace, creating Roles and
  # RoleBindings, and `oc adm policy add-role-to-user admin` creates a RoleBinding to the admin ClusterRole
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - create
      - patch
      - update
  # Those Roles grant more than the pipeline holds (nss-managed-role-from-* has */*), so creating them requires escalate.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - escalate
  # rbac.yml.j2 also creates a RoleBinding to nss-managed-role-from-* (a Role, not a ClusterRole), which needs bind on that Role.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    resourceNames:
      - nss-managed-role-from-ibm-cpd-operators
    verbs:
      - bind
